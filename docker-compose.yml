services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myatelier_pro}
      POSTGRES_USER: ${POSTGRES_USER:-beauty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beauty}
    # تحجيم استهلاك الذاكرة وحفظ الموارد
    command: >
      postgres
      -c shared_buffers=256MB
      -c work_mem=8MB
      -c maintenance_work_mem=64MB
      -c effective_cache_size=768MB
      -c max_connections=50
    # Removed host port mapping for security
    # ports:
    #   - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beauty} -d ${POSTGRES_DB:-myatelier_pro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: myatelier_redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-your-super-strong-redis-password-here-2026}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-your-super-strong-redis-password-here-2026}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-your-super-strong-redis-password-here-2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-beauty}:${POSTGRES_PASSWORD:-beauty}@db:5432/${POSTGRES_DB:-myatelier_pro}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

#  frontend:
#    build:
#      context: ./frontend
#    environment:
#      VITE_API_PROXY_TARGET: http://backend:8000
#    volumes:
#      - ./frontend:/app
#      - frontend_node_modules:/app/node_modules
#    ports:
#      - "5173:5173"
#    depends_on:
#      - backend

  nginx:
    image: nginx:alpine
    container_name: myatelier_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
#  frontend_node_modules:
  redis_data: