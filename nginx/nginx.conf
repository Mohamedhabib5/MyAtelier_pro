server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # تقديم ملفات الواجهة الأمامية الساكنة مباشرة
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API (بدون شرطة مائلة في النهاية للحفاظ على بادئة /api)
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend docs (Swagger)
    location /docs {
        proxy_pass http://backend:8000/docs;
    }

    # السماح برفع ملفات وصور بحجم أكبر (مهم للصور والنسخ الاحتياطية)
    client_max_body_size 50M;

    # تحسين وتسريع تحميل الملفات الثابتة (الصور، الخطوط، ملفات التنسيق)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}
